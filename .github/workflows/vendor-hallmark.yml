name: Vendor Hallmark skill (temporary)
on:
  push:
    branches: [chore/install-hallmark-skill-20261122]
    paths:
      - .github/workflows/vendor-hallmark.yml
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Copy pinned upstream skill
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/Nutlope/hallmark.git /tmp/hallmark
          git -C /tmp/hallmark checkout 04977e15f3dfd6ee4b74c887dac3eb52665d6c92 -- skills/hallmark
          mkdir -p .agents/skills
          cp -a /tmp/hallmark/skills/hallmark .agents/skills/hallmark
          printf '%s\n' 'Source: https://github.com/Nutlope/hallmark' 'Commit: 04977e15f3dfd6ee4b74c887dac3eb52665d6c92' 'License: MIT (see LICENSE)' > .agents/skills/hallmark/UPSTREAM.txt
          test -s .agents/skills/hallmark/SKILL.md
          test -s .agents/skills/hallmark/scripts/sloplint.mjs
          test -s .agents/skills/hallmark/LICENSE
      - name: Commit vendored skill to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agents/skills/hallmark
          git diff --cached --quiet || git commit -m 'chore: vendor pinned Hallmark skill'
          git push origin HEAD:chore/install-hallmark-skill-20261122
