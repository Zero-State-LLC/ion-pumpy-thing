name: Hallmark audit (temporary)
on:
  push:
    branches: [fix/hallmark-ui-floor-20261122]
    paths:
      - .github/workflows/hallmark-audit.yml
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Hallmark static audit
        run: |
          set +e
          node .agents/skills/hallmark/scripts/sloplint.mjs index.html --scope app --genre playful --json > hallmark-audit.json
          status=$?
          cat hallmark-audit.json
          echo "Hallmark exit status: $status"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: hallmark-audit
          path: hallmark-audit.json
