name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-deploy-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Run tests
        run: node --test tests/game.test.cjs tests/seo.test.cjs
      - name: Build Pages dist
        run: scripts/build-dist.sh
      - name: Require deploy secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Set the CLOUDFLARE_API_TOKEN repository secret first."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Set the CLOUDFLARE_ACCOUNT_ID repository secret first."; exit 1; }
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@2ef9f398b9175c68f953e40d679493850d640a85 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=ion-pumpy-thing --branch=main --commit-hash=${{ github.sha }}
      - name: Smoke the production host
        run: |
          set -euo pipefail
          cb="${GITHUB_SHA:-$(date +%s)}"
          deadline=$((SECONDS + 180))
          ok=0
          while (( SECONDS < deadline )); do
            set +e
            html="$(curl -fsS "https://ion-pumpy-thing.app/?cb=${cb}")"
            privacy_code="$(curl -sS -o /dev/null -w '%{http_code}' "https://ion-pumpy-thing.app/privacy?cb=${cb}")"
            curl -fsS "https://ion-pumpy-thing.app/assets/og-image.png?cb=${cb}" -o /tmp/og-image.png
            png_rc=$?
            set -e
            if [[ "$png_rc" -eq 0 ]]; then
              png_ok="$(python3 -c "
from pathlib import Path
p = Path('/tmp/og-image.png')
data = p.read_bytes() if p.exists() else b''
ok = (
    data[:8] == b'\\x89PNG\\r\\n\\x1a\\n'
    and data[12:16] == b'IHDR'
    and int.from_bytes(data[16:20], 'big') == 1200
    and int.from_bytes(data[20:24], 'big') == 630
)
print('yes' if ok else 'no')
")"
            else
              png_ok=no
            fi
            if [[ "$html" == *"takes that account as its premise"* && "$privacy_code" == "200" && "$png_ok" == "yes" ]]; then
              ok=1
              break
            fi
            sleep 10
          done
          if [[ "$ok" -ne 1 ]]; then
            echo "Production smoke failed after retries: premise text, /privacy 200, or 1200x630 OG image."
            echo "privacy_http=$privacy_code og_ok=$png_ok html_bytes=${#html}"
            exit 1
          fi
          echo "Production smoke passed."

  preview:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      secrets.CLOUDFLARE_API_TOKEN != '' &&
      secrets.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Run tests
        run: node --test tests/game.test.cjs tests/seo.test.cjs
      - name: Build Pages dist
        run: scripts/build-dist.sh
      - name: Deploy preview
        id: preview
        uses: cloudflare/wrangler-action@2ef9f398b9175c68f953e40d679493850d640a85 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=ion-pumpy-thing --branch=pr-${{ github.event.pull_request.number }} --commit-hash=${{ github.sha }}
      - name: Comment the preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.preview.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.preview.outputs.pages-deployment-alias-url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          url="${ALIAS_URL:-$PREVIEW_URL}"
          if [[ -z "$url" ]]; then
            echo "No preview URL was returned by wrangler-action."
            exit 1
          fi
          gh pr comment "$PR_NUMBER" --body "Preview deployment for this PR: ${url}"
