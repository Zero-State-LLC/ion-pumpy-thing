name: Temporary Orbit visual review
on:
  push:
    branches: [feat/orbit-second-camera-thermal-20261122]
    paths: [.github/workflows/temp-orbit-visual-qa.yml]
permissions:
  contents: read
jobs:
  orbit-screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Install browser driver
        run: npm install --no-save --ignore-scripts --no-audit --no-fund puppeteer-core@24
      - name: Capture Orbit 2D and 3D camera parity
        shell: bash
        run: |
          python3 -m http.server 8080 >/tmp/orbit-http.log 2>&1 &
          sleep 2
          mkdir -p orbit-review
          node --input-type=module <<'EOF'
          import puppeteer from 'puppeteer-core';
          import { readFileSync } from 'node:fs';
          const browser = await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-gpu','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          const saved = JSON.parse(readFileSync('tests/fixtures/ready-to-converge.json', 'utf8'));
          try {
            for (const [width,height] of [[320,640],[390,844],[1280,800]]) {
              const page = await browser.newPage();
              await page.setViewport({width,height,deviceScaleFactor:1});
              await page.goto('http://127.0.0.1:8080/',{waitUntil:'domcontentloaded',timeout:45000});
              await page.waitForFunction(() => !!window.__lab && !!document.getElementById('step-3'),{timeout:20000});
              const revision = await page.evaluate(() => window.__lab.SOURCE_REVISION);
              // Set the saved run before the game's startup script. Writing only before
              // reload loses the fixture when the page's unload handler saves Ignite.
              const injected = await page.evaluateOnNewDocument(({run,revision}) => {
                localStorage.setItem('ipt-run-v2',JSON.stringify({...run,sourceRevision:revision}));
                localStorage.setItem('ion-pumpy-view-v1',JSON.stringify({on:false}));
              }, {run:saved,revision});
              await page.reload({waitUntil:'domcontentloaded',timeout:45000});
              await page.waitForFunction(() => !!window.__lab && !!document.getElementById('step-3'),{timeout:20000});
              await page.removeScriptToEvaluateOnNewDocument(injected.identifier);
              await page.click('#step-3');
              const selected = await page.evaluate(() => document.getElementById('step-3').getAttribute('aria-current'));
              if (selected !== 'step') throw new Error(`Orbit step did not load at ${width}px; abort screenshot`);
              await page.screenshot({path:`orbit-review/orbit-flat-${width}.png`,fullPage:true});
              await (await page.$('.view')).screenshot({path:`orbit-review/orbit-flat-scene-${width}.png`});
              await page.evaluate(() => {
                const el=document.getElementById('view-3d');
                el.checked=true;
                el.dispatchEvent(new Event('change',{bubbles:true}));
              });
              await page.waitForFunction(() => !document.getElementById('gl').hidden,{timeout:30000});
              await new Promise(r=>setTimeout(r,1000));
              await page.screenshot({path:`orbit-review/orbit-3d-${width}.png`,fullPage:true});
              await (await page.$('.view')).screenshot({path:`orbit-review/orbit-3d-scene-${width}.png`});
              const labels=await page.evaluate(() => ({step:document.getElementById('step-3').getAttribute('aria-current'),description:document.getElementById('cv').getAttribute('aria-label'),mode:document.getElementById('view-3d-status').textContent}));
              console.log(JSON.stringify({width,height,labels}));
              await page.close();
            }
          } finally { await browser.close(); }
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbit-camera-visual-qa
          path: orbit-review/
