name: Temporary Hallmark instrument audit
on:
  push:
    branches: [fix/hallmark-control-spacing-20261122]
    paths: [.github/workflows/temp-hallmark-instrument.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Install browser driver
        run: npm install --no-save --ignore-scripts --no-audit --no-fund puppeteer-core@24
      - name: Run Hallmark Chrome render audit
        shell: bash
        run: |
          python3 -m http.server 8080 >/tmp/hallmark-http.log 2>&1 &
          sleep 2
          node .agents/skills/hallmark/scripts/sloplint.mjs --url http://127.0.0.1:8080/ --scope app --genre playful --render --json > hallmark-render.json || true
          cat hallmark-render.json
          node -e "const a=require('./hallmark-render.json');if(a.summary?.render!=='ran'||a.summary?.fails!==0)process.exit(1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hallmark-instrument-qa
          path: |
            hallmark-render.json
            .hallmark/shots/
